name: Weekly Base Image Rebuild & CVE Scan

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-cve-rebuild
  cancel-in-progress: true

jobs:
  rebuild-and-scan:
    name: Rebuild & Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: apps/api/Dockerfile
          - service: worker
            file: apps/worker/Dockerfile
          - service: web
            file: apps/web/Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild Image with Latest Upstream Base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          pull: true
          no-cache: true
          load: true
          tags: enum-${{ matrix.service }}:security-scan

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enum-${{ matrix.service }}:security-scan
          format: table
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true
