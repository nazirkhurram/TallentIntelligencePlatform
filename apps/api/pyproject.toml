[project]
name = "enum-api"
version = "0.1.0"
description = "FastAPI backend modular monolith for ENUM Talent Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "minio>=7.2.8",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "enum-schema",
    "faker>=30.0.0",
]


[tool.uv.sources]
enum-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enum_api"]
