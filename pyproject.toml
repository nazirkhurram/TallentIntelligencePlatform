[project]
name = "enum-talent-platform"
version = "0.1.0"
description = "ENUM Talent Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/worker",
    "packages/schema",
]

[tool.uv.sources]
enum-schema = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipython>=8.26.0",
]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "pytest-mock>=3.14.0",
]
evals = [
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "tqdm>=4.66.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false


[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "apps/worker/tests", "evals"]
asyncio_mode = "auto"
